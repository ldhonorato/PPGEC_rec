name: Build and push web image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ppgec_rec

jobs:
  build-and-push:
    name: Build and push web image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A versao exibida vem do arquivo VERSION, versionado junto com o codigo.
      #
      # Antes esta esteira passava github.ref_name como APP_VERSION. Isso so
      # produz uma versao quando o build vem de uma tag; disparado por push em
      # main -- que e o caso de todo merge de PR -- o valor e o nome do branch, e
      # o rodape de todas as telas exibia "vmain".
      #
      # A proveniencia do build continua no APP_REVISION (o SHA do commit), que
      # e onde ela pertence: uma coisa e "que versao do produto e esta", outra e
      # "de que commit saiu esta imagem".
      - name: Ler a versao do repositorio
        id: versao
        run: |
          versao="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$versao" ]; then
            echo "::error file=VERSION::O arquivo VERSION esta vazio."
            exit 1
          fi
          echo "valor=$versao" >> "$GITHUB_OUTPUT"
          echo "Versao para esta imagem: $versao"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.versao.outputs.valor }}
            APP_REVISION=${{ github.sha }}
            APP_BUILD_RUN_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
